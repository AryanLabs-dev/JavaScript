<head>

<style>
    body {
        background-color: black;
        color: white;
    }

    h1 {
        font-weight: bolder;
        display: flex;
        justify-content: center;
        align-items: center;
        display: flex;
    }

    ::before {
        color: rgb(255, 0, 0);
        background-color: aqua;
        border-radius: 10px;
        animation: typing 2s ease-in-out;

    }

    @keyframes typing {
        from {}

        to {
            types: Hello Aryan;

            color: blue;
        }
    }

    h1::before {
        content: "Aryan Say";
    }

</style>
